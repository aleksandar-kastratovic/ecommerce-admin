image: node:14.15.3

definitions:
  services:
    docker:
      memory: 3072
  steps:
    - step: &execute
        name: Staging
        deployment: staging
        trigger: automatic
        services:
          - docker
        caches:
          - docker
        script:
          - export IMAGE=$DOCKER_ACCOUNT/$DOCKER_IMAGE
          - printf "\nDeploy\n    env  $BITBUCKET_DEPLOYMENT_ENVIRONMENT\n    img  $IMAGE\n\nServer\n    host $SERVER_HOST\n    port $SERVER_PORT\n    user $SERVER_USER\n\nApp\n    port $PORT\n    url  $API_URL\n";

          # Build the image
          - docker build --build-arg API_URL=$API_URL -t $IMAGE .
          - docker tag $IMAGE $IMAGE:latest

          # Push the image
          - docker login --username $DOCKER_ACCOUNT --password $DOCKER_PASSWORD
          - docker push $IMAGE:latest

          # Deploy on the server
          - export DEPLOY="deploy-$DOCKER_IMAGE-$BITBUCKET_DEPLOYMENT_ENVIRONMENT-$RANDOM.sh"
          - scp -o StrictHostKeyChecking=no -P ${SERVER_PORT} deploy/deploy.sh $SERVER_USER@$SERVER_HOST:$DEPLOY
          - ssh -o StrictHostKeyChecking=no -p ${SERVER_PORT}                  $SERVER_USER@$SERVER_HOST "
                    DOCKER_ACCOUNT='${DOCKER_ACCOUNT}'
                    DOCKER_IMAGE='${DOCKER_IMAGE}'
                    PROJECT='${BITBUCKET_DEPLOYMENT_ENVIRONMENT}'
                    PORT='${PORT}'
                \"./$DEPLOY\" &&
                rm \"$DEPLOY\""

pipelines:
  branches:
    master:
      - step: *execute

    prod-stojic:
      - step:
          <<: *execute
          name: Stojić
          deployment: stojic

    prod-lastva:
      - step:
          <<: *execute
          name: Lastva
          deployment: Lastva

    prod-reflekta:
      - step:
          <<: *execute
          name: Reflekta
          deployment: reflekta

    prod-akt:
      - step:
          <<: *execute
          name: Akt
          deployment: akt
    
    prod-maximon:
      - step:
          <<: *execute
          name: Maximon
          deployment: maximon

    prod-ringzandtingz:
      - step:
          <<: *execute
          name: RingzAndThingz
          deployment: ringzandthingz

    prod-mobs:
      - step:
          <<: *execute
          name: Mobs
          deployment: mobs

    prod-ukusnoizdravo:
